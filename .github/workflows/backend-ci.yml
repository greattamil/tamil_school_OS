name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Cross-tenant isolation tests: PRD 6.1 requires these to pass in CI on every
  # commit, including the concurrent single-connection pooling-leak test that a
  # sequential test would not catch.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DB_PASSWORD: app_user_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install golang-migrate CLI
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      # GitHub Actions service containers don't run docker-entrypoint-initdb.d, so
      # the non-owner app_user role (deploy/postgres-init/01-app-role.sh in local
      # Docker Compose) is created here the same way, by hand.
      - name: Create app_user role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d school_erp -v ON_ERROR_STOP=1 <<-EOSQL
            CREATE ROLE app_user LOGIN PASSWORD '${APP_DB_PASSWORD}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          EOSQL

      - name: Run migrations
        run: migrate -path=migrations -database "postgres://postgres:postgres@localhost:5432/school_erp?sslmode=disable" up

      - name: Run cross-tenant isolation tests
        env:
          TEST_DATABASE_URL: postgres://app_user:app_user_ci_password@localhost:5432/school_erp?sslmode=disable
        run: go test -tags=integration -v ./test/...
